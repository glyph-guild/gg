# The scope-enforcing proxy, and the ONLY thing on this machine that sees the
# Docker socket.
#
# The socket is host root: anything that reaches it can start a privileged
# container and own the machine. That is why the resident runner is pointed at
# this proxy and never at the socket - and why nothing else here mounts it.
# PoolHostTests holds that: exactly one artefact may name the socket, and it is
# this one.
#
# And the registry the pool's images live in, which is given nothing of the
# kind. APoolHostHasItsRegistryTests holds the service to that.
services:
  pool-proxy:
    image: nginx:1.27
    container_name: gg-pool-proxy
    restart: unless-stopped
    # LOOPBACK ONLY. The proxy refuses out-of-scope reaches, but it does not
    # authenticate - anything that can reach the port can do everything the
    # pool is allowed to do. Binding it to the host's loopback is what keeps
    # "allowed to act on the pool" and "reachable from the network" apart.
    ports:
      - "127.0.0.1:23750:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # THE CONFIG IS REFERENCED, NEVER COPIED. A second copy beside this file
      # would be a second place the allowlist lives, and the prefix it names is
      # already one half of a contract with the runner - PoolPrefixTests
      # compares that file against PoolNaming. Two copies is how the halves
      # start disagreeing.
      - ../../scripts/pool-proxy/nginx.conf:/etc/nginx/nginx.conf:ro

  # THE HOST'S OWN REGISTRY, at the one address everything else already names.
  # A strategy pins its member image as 127.0.0.1:5000/...@sha256:..., and the
  # proxy lets a build tag and a push reach 127.0.0.1:5000 and nowhere else.
  # Until this service existed a host had a registry only if a person had
  # started one, and a host stood up from these files built an image with
  # nowhere to put it.
  registry:
    # PINNED BY DIGEST, not by tag. This holds every image a member runs, so
    # what it is has to be a version somebody named. registry:2 rather than 3,
    # which is a new major version: adopting one on the machine that holds
    # every member image is its own change, not a default taken here.
    image: registry:2@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
    container_name: gg-pool-registry
    restart: unless-stopped
    # LOOPBACK ONLY, for the proxy's reason. It does not authenticate either,
    # and a push decides what a member runs. The daemon pushes to it over the
    # host's loopback, which Docker trusts without TLS, so no daemon setting
    # is needed.
    ports:
      - "127.0.0.1:5000:5000"
    # NO SOCKET. It stores images; it never starts anything.
    volumes:
      - registry-data:/var/lib/registry

volumes:
  # NAMED, so the images a strategy pins survive the container being replaced.
  registry-data:
