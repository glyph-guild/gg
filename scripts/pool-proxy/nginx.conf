# The scope-enforcing socket proxy - slice twelve's answer to section 12's
# hardest row. The Docker socket is host root; this proxy is the something
# that is not us which refuses an out-of-inventory reach, and the resident
# runner's GG_POOL_ENDPOINT points HERE, never at the socket.
#
# Allowed, and nothing else:
#   GET  /v*/containers/json           the pool listing (prefix re-checked client-side)
#   POST /v*/containers/create?name=gg-pool-*      creating a pool member
#   GET  /v*/containers/gg-pool-*/json             inspecting a pool member
#   POST /v*/containers/gg-pool-*/{start,stop}      operating a pool member
#   DEL  /v*/containers/gg-pool-*                   destroying a pool member
#   POST /v*/build?t=127.0.0.1:5000/*               building a pool image (slice forty-one)
#   POST /v*/images/127.0.0.1:5000/*/push           pushing it to the host's own registry
#   GET  /v*/images/json?filters=...127.0.0.1:5000  listing what this host built
#   DEL  /v*/images/127.0.0.1:5000/*:*              removing a superseded one
#
# THE PREFIX IS A CONTRACT WITH THE RUNNER, held on both sides. It used to
# name the WALK's pool - so every other pool was refused at create, and the
# refusal was a 403, which is also what a correct out-of-scope refusal looks
# like. The bug wore the safety property's face. PoolNaming.ReservedPrefix is
# the other half, refuses early, and a test compares this file against it.
#
# Everything else - exec, volumes, networks, other containers, any image
# outside the host's own registry, and any unfiltered image listing - answers
# 403 from the proxy itself. The two image rules are the build's own
# housekeeping and go no wider than what this runner pushed: nothing else on
# the host reclaims a member image, and the bake-and-roll pipeline leaves one
# behind per build. HONEST GAP, recorded where a reader
# looks: this is endpoint+name filtering, the operate-only scope; a
# production host wants this same proxy hardened (or a daemon authz plugin),
# and shipping the slice does not close that.
#
# Run it (the socket is mounted into this one container and nowhere else):
#   docker run -d --name gg-pool-proxy -p 127.0.0.1:23750:80 \
#     -v /var/run/docker.sock:/var/run/docker.sock \
#     -v "$PWD/scripts/pool-proxy/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27
# Workers must read the mounted socket, which is root-owned inside this
# container - and this container is the ONLY thing that ever sees it.
user root;
events {}
http {
  server {
    listen 80;

    # The pool listing. The daemon's name filter is substring-matched, so the
    # adapter re-checks the prefix; the proxy's job is that nothing OUTSIDE
    # the listing and the pool's own members is reachable at all.
    location ~ ^/v[0-9.]+/containers/json$ {
      proxy_pass http://docker;
    }
    location = /containers/json {
      proxy_pass http://docker;
    }

    # Creating a pool member: only names carrying the pool prefix.
    location ~ ^(/v[0-9.]+)?/containers/create$ {
      if ($arg_name !~ ^gg-pool-) { return 403; }
      proxy_pass http://docker;
    }

    # Acting on a pool member, BY OPERATION rather than by prefix. This rule
    # used to be `^(/v[0-9.]+)?/containers/gg-pool-` with nothing anchoring the
    # end, so it matched every sub-path a member has: /exec, /attach and
    # /archive were all proxied, against this file's own comment.
    #
    # Exec was refused only by ACCIDENT. Docker splits it in two - create at
    # /containers/{id}/exec, run at /exec/{id}/start - and only the second fell
    # to the catch-all, because it happens to sit elsewhere in somebody else's
    # URL scheme. That is not a control.
    #
    # /archive is the one that matters next: it moves a container's whole
    # filesystem in and out, and members are about to hold a customer's
    # repository. ScopeProxyReachTests holds every line of this.
    location ~ ^(/v[0-9.]+)?/containers/gg-pool-[^/]+/(json|start|stop)$ {
      proxy_pass http://docker;
    }

    # Deleting a member: the bare path, and nothing below it.
    location ~ ^(/v[0-9.]+)?/containers/gg-pool-[^/]+$ {
      proxy_pass http://docker;
    }

    # BUILDING A POOL'S IMAGE, INTO THE HOST'S OWN REGISTRY AND NOWHERE ELSE
    # (slice forty-one, rule 17). A build is a widening of what this proxy lets
    # through, so it is admitted as narrowly as it can be said: the tag must
    # name 127.0.0.1:5000 - the registry a strategy pins from - and a `remote`
    # context, which the daemon would fetch itself from wherever it points, is
    # refused outright. nginx does not decode $arg_ values, so the tag's ':' and
    # '/' are admitted in the spelling a client's escaping gives them too. The
    # regex is quoted because it has parentheses in it.
    #
    # The build runs the recipe's own steps on this host's daemon, as root in
    # the build. That is not sandboxed here and nothing claims it is; what puts
    # a person in front of it is that changing where a recipe comes from is a
    # widening, gated in the control plane. TheBuildScopeIsProbedTests holds
    # these lines, and the scope probe asks for the reach just outside them.
    location ~ ^(/v[0-9.]+)?/build$ {
      if ($arg_t !~ "^127\.0\.0\.1(:|%3[Aa])5000(/|%2[Ff])") { return 403; }
      if ($arg_remote != "") { return 403; }
      client_max_body_size 512m;
      proxy_request_buffering off;
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_pass http://docker;
    }

    # Pushing what was built - only an image in the host's own registry.
    location ~ ^(/v[0-9.]+)?/images/127\.0\.0\.1:5000/[^?]+/push$ {
      proxy_buffering off;
      proxy_read_timeout 1800s;
      proxy_pass http://docker;
    }

    # RECLAIMING WHAT A BUILD SUPERSEDED. Nothing else on this host frees a
    # member image, and the bake-and-roll pipeline leaves one behind per build
    # - measured three times at 2.2 G free of 61. So the build's own
    # housekeeping is admitted, and as narrowly as the build and push above it.
    #
    # The listing must carry a reference filter naming this host's registry,
    # which is the only listing the adapter asks for. nginx does not decode
    # $arg_ values, so the escaped spellings are admitted alongside the plain
    # ones. A listing of every image on the host is still refused.
    location ~ ^(/v[0-9.]+)?/images/json$ {
      if ($arg_filters !~ "127(\.|%2[Ee])0(\.|%2[Ee])0(\.|%2[Ee])1(:|%3[Aa])5000") { return 403; }
      proxy_pass http://docker;
    }

    # And the removal itself: BY TAG, in the host's own registry, so this says
    # "what this runner pushed, this runner may remove" and nothing wider. A
    # delete by image id would have to be admitted for every image on the host,
    # which is why the adapter deletes by tag - removing the last tag removes
    # the image.
    #
    # THE TAG'S COLON IS PART OF THE PATTERN, which is what keeps this from
    # being `/images/127.0.0.1:5000/<anything>`: `[^/?]+:[^/?:]+` is one path
    # segment carrying a tag, so `/gg-member/json` and `/gg-member/push` do not
    # match it and the inspect and push surfaces stay where they were.
    #
    # `force` is refused here as well as never sent: without it the daemon
    # refuses an image a container is using, and that refusal is the guard that
    # keeps a running member's image. The method check is belt - nothing else
    # this proxy admits lives at a tag path.
    location ~ ^(/v[0-9.]+)?/images/127\.0\.0\.1:5000/[^/?]+:[^/?:]+$ {
      if ($request_method != DELETE) { return 403; }
      if ($arg_force != "") { return 403; }
      proxy_pass http://docker;
    }

    # The refusal the scope probe expects, and the whole point.
    location / {
      return 403;
    }
  }

  upstream docker {
    server unix:/var/run/docker.sock;
  }
}
