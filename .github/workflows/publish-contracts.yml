name: Publish Gg.Contracts

on:
  push:
    branches: [main]

jobs:
  pack:
    name: pack and publish the declared contract version
    runs-on: ubuntu-latest
    permissions:
      # Releases, because the release asset is the distribution channel that
      # actually works across repositories - see the note on the push step.
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # The version comes from the CONTRACT, not from this repository's commit
      # count. Under the old scheme a README fix bumped the wire contract
      # exactly as much as a new message type did, so the number told a
      # consumer nothing about whether they needed to care.
      #
      # ContractSurfaceTests is what makes the declared number trustworthy: it
      # fingerprints the wire surface and fails the build if that surface moved
      # without this version moving. CI only has to read it.
      - name: Read the declared contract version
        run: |
          version="$(dotnet msbuild Gg.Contracts/Gg.Contracts.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          echo "Contract version: $version"
          echo "CONTRACT_VERSION=$version" >> "$GITHUB_ENV"
      # ContractRelease is what lets this pack claim the declared version. It
      # is set HERE and nowhere else: a pack from a working copy gets a
      # -local.<timestamp> label, so it can never land in a NuGet cache under a
      # number a release published. See the note in Gg.Contracts.csproj for the
      # incident that bought this line.
      - run: dotnet pack Gg.Contracts/Gg.Contracts.csproj -c Release -o artifacts -p:ContractRelease=true
      # The release path checks its own artifact, because the tag below and the
      # asset it carries have to agree. Without ContractRelease the pack would
      # be GlyphGuild.Gg.Contracts.0.114.0-local.<timestamp>.nupkg published
      # under a tag reading contracts-v0.114.0, which is the confusion this
      # whole mechanism exists to prevent.
      - name: The packed version is the declared one
        run: |
          expected="artifacts/GlyphGuild.Gg.Contracts.$CONTRACT_VERSION.nupkg"
          found="$(ls artifacts/*.nupkg)"
          if [[ "$found" != "$expected" ]]; then
            echo "packed '$found' but the declared contract version is $CONTRACT_VERSION" >&2
            echo "expected '$expected' - did the pack step lose -p:ContractRelease=true?" >&2
            exit 1
          fi
          echo "$found"
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
      # Two destinations, for one reason worth writing down.
      #
      # GitHub Packages' NuGet registry is REPOSITORY-SCOPED: a package there
      # is permanently linked to this repo and inherits its permissions, with
      # no per-package visibility toggle and no way to grant another repo
      # access. A workflow in glyph-guild/good-grief authenticates with its own
      # GITHUB_TOKEN, which is scoped to good-grief, so it gets 403 no matter
      # what permissions it asks for. Nothing in a settings page fixes that.
      #
      # A release asset on a PUBLIC repository, by contrast, downloads with no
      # authentication at all. So the release is the channel the control plane
      # actually consumes, and the registry push stays because it is the
      # conventional place to look and costs nothing.
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source https://nuget.pkg.github.com/glyph-guild/index.json \
            --skip-duplicate

      - name: Attach the package to a public Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="contracts-v$CONTRACT_VERSION"

          # Most pushes to main do not touch the contract, so most runs land
          # here with a version that already shipped. Skipping is correct: an
          # already-published contract version is immutable by definition, and
          # re-uploading its asset would churn the timestamp on an artifact
          # people pin. To republish, bump the version.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published - the contract has not changed."
            exit 0
          fi

          gh release create "$tag" artifacts/*.nupkg \
            --title "Gg.Contracts $CONTRACT_VERSION" \
            --notes "The runner wire protocol at $CONTRACT_VERSION.

          Consumed by the control plane as a pinned package. This version exists because the wire surface changed: see Gg.Contracts/contract-versions.json for the fingerprint it was published with."
