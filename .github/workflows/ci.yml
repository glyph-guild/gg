name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      # The RealAgent category is excluded DELIBERATELY and by name, exactly as
      # the control plane excludes RealGitHub. Those tests drive a real agent
      # binary against a real tree and refuse loudly rather than passing when
      # unconfigured - so excluding them here is the difference between a green
      # CI and a CI that cannot run at all. The exclusion is written down so
      # that "an agent ran" is never something CI appears to have claimed.
      - run: dotnet test -c Release -- --treenode-filter '/*/*/*[Category!=RealAgent]/*'

  aot:
    name: aot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: AOT-publish gg as a single self-contained binary
        run: dotnet publish Gg.Cli -c Release -r linux-x64 -o artifacts/aot
      - name: The published binary actually runs
        run: ./artifacts/aot/gg --version

  ci:
    name: CI
    needs: [dotnet, aot]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
