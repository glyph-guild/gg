name: Publish gg

on:
  push:
    branches: [main]

# TWO ARTIFACTS FROM ONE RELEASE, because they serve different machines.
#
# The .nupkg is a .NET tool: `dotnet tool install -g` for anyone who already
# has the SDK. The native binaries need nothing at all - no runtime, no SDK, no
# compiler - which is what a pool host has, and why provisioning should use
# them rather than cloning and building.
#
# THE TOOL GOES TO nuget.org, and the binaries stay release assets. Both are
# still attached to the release - one place to see what a version shipped - but
# the package is also pushed to a real feed, because `dotnet tool install
# --add-source` takes a DIRECTORY and not a URL. Off a releases page the tool
# is a download-then-install and `dotnet tool update` cannot see it at all;
# that update path is the whole reason gg builds no updater of its own.

jobs:
  pack:
    name: pack the tool
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # Read rather than computed, exactly as publish-contracts.yml does. The
      # number lives in Directory.Build.props and every project inherits it -
      # "one install, one executable, one version". Bumping it is what makes a
      # release happen; nothing here derives a version from the commit count.
      - name: Read the declared version
        id: version
        run: |
          version="$(dotnet msbuild Gg.Cli/Gg.Cli.csproj -getProperty:Version -nologo | tr -d '[:space:]')"
          echo "gg version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # -p:PublishAot=false at PACK TIME ONLY. A tool package is IL; the
      # project stays AOT for every other command, including ci.yml's aot job
      # and the binaries job below. PackagingTests holds that property in the
      # project so this stays an exception rather than becoming the default.
      - run: dotnet pack Gg.Cli -c Release -p:PublishAot=false -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: tool-package
          path: artifacts/*.nupkg
      # THE HALF OF A POOL HOST THAT IS NOT THE BINARY. Installing gg from a
      # feed leaves the proxy without its compose file or its nginx config, and
      # both used to come from the checkout provisioning no longer makes.
      #
      # Pasting them into cloud-init is the obvious alternative and
      # PoolProvisioningTests forbids it, for the reason compose.yaml gives in
      # its own comment: the allowlist names the reserved prefix, PoolPrefixTests
      # compares THIS repository's copy against PoolNaming, and a second copy is
      # where the halves of that contract start disagreeing.
      #
      # PATHS ARE PRESERVED, and that is the whole trick. compose.yaml mounts
      # ../../scripts/pool-proxy/nginx.conf, so the tar is taken from the
      # repository root and the relative path resolves wherever it is unpacked.
      # Flattening this is a proxy that starts with nginx's default config and
      # allows everything.
      - name: Bundle what a pool host needs beside the binary
        run: |
          tar -czf artifacts/gg-pool-host.tar.gz \
            deploy/pool-host/compose.yaml \
            deploy/pool-host/gg-runner-maintain.service \
            scripts/pool-proxy/nginx.conf
      - uses: actions/upload-artifact@v4
        with:
          name: pool-host-bundle
          path: artifacts/*.tar.gz

  binaries:
    name: ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # AOT CANNOT CROSS-COMPILE: each runtime identifier needs a runner of
          # that platform. Both are free on a public repository. win-x64 on
          # windows-latest is one entry away if it is ever wanted.
          - { os: ubuntu-latest, rid: linux-x64 }
          - { os: macos-latest, rid: osx-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: AOT-publish gg
        run: dotnet publish Gg.Cli -c Release -r ${{ matrix.rid }} -o out
      - name: The published binary actually runs
        run: ./out/gg --version
      # Named by platform, because a release carrying two files called `gg`
      # helps nobody.
      - name: Name it after the platform it runs on
        run: |
          mkdir -p artifacts
          tar -czf "artifacts/gg-${{ matrix.rid }}.tar.gz" -C out gg
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: artifacts/*.tar.gz

  release:
    name: attach everything to one release
    needs: [pack, binaries]
    runs-on: ubuntu-latest
    permissions:
      # The only permission needed, and no secret at all - which is the whole
      # benefit of publishing as a release asset rather than to a registry.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: incoming
      - name: Attach the tool and the binaries to a public Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.pack.outputs.version }}
          # WHICH REPOSITORY, stated rather than inferred. This job downloads
          # artifacts and never checks out, so there is no .git for `gh` to read
          # a remote from - and its failure is "fatal: not a git repository",
          # which reads like a broken checkout rather than a missing setting.
          #
          # The alternative is adding actions/checkout purely to satisfy gh,
          # cloning a repository this job does not otherwise need.
          GH_REPO: ${{ github.repository }}
        run: |
          tag="v$VERSION"

          # Most pushes to main do not bump the version, so most runs land here
          # with one that already shipped. Skipping is correct: a published
          # version is immutable, and re-uploading its assets would churn the
          # timestamp on files people have pinned or scripted against.
          #
          # The failure mode this creates is worth naming: forgetting to bump
          # VersionPrefix means a release that silently does not happen. The
          # log line below is the only place that says so.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "$tag already published - VersionPrefix has not moved, so nothing to release."
            exit 0
          fi

          gh release create "$tag" incoming/*/* \
            --title "gg $VERSION" \
            --notes "## Install

          **A machine with no .NET installed** - a pool host, a CI runner, a laptop:

          \`\`\`sh
          curl -fsSL https://github.com/glyph-guild/gg/releases/download/$tag/gg-linux-x64.tar.gz | tar xz
          sudo install -m 0755 gg /usr/local/bin/gg
          \`\`\`

          Swap \`linux-x64\` for \`osx-arm64\` on an Apple-silicon Mac.

          **As a .NET tool**, if you already have the SDK — from nuget.org, so there is nothing to download first:

          \`\`\`sh
          dotnet tool install -g GlyphGuild.Gg.Cli --version $VERSION
          \`\`\`

          Drop \`--version\` to take the newest. Pinning is the better default on anything unattended, and \`dotnet tool update -g GlyphGuild.Gg.Cli --version X\` moves it later.

          Either way the command is \`gg\`.

          \`gg\` never replaces its own binary. It will tell you when it is behind and name the command; moving the bytes is \`dotnet\`'s job, or yours."

  # LAST, AND DELIBERATELY SO. `needs: [release]` is not about artefacts - this
  # job downloads its own - it is about order. A GitHub release can be deleted;
  # a version on nuget.org cannot. Unlisting hides it from search and every
  # client that already knows the number still resolves it, so the push is the
  # one irreversible act in this workflow and it happens after the reversible
  # one has succeeded.
  nuget:
    name: push the tool to nuget.org
    needs: [pack, release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tool-package
          path: artifacts
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # --skip-duplicate CARRIES THE IDEMPOTENCE, and it is why this is its own
      # job rather than another step in `release`. That job returns early when
      # the tag already exists, so a run where the release succeeded and the
      # push failed could never be repaired by re-running it: the second attempt
      # would exit before reaching the push. Here a re-run is always safe -
      # nuget.org answers 409 for a version it already has, and this turns that
      # into a warning instead of a red build.
      #
      # THE KEY IS THE TRUST ROOT. Repository signing proves a package came
      # through nuget.org's pipeline, not that glyph-guild sent it: anyone
      # holding this key pushes, nuget.org signs, and every client accepts. It
      # is the one credential in either repository that can ship gg to a fleet.
      - name: Push
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
