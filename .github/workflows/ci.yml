name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      # FULL HISTORY, because UnreadMemberTests reads a commit through
      # `git show`. actions/checkout defaults to depth 1, and the retro test
      # FAILS rather than skipping on purpose - a control that quietly passed
      # when it could not read history would be the exact thing this scan was
      # written to catch. So the fetch changes and the test does not.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      # RealAgent, RealRemote, RealDocker and RealStack are excluded
      # DELIBERATELY and by name. Those
      # tests drive a real agent binary against a real tree, and land real
      # branches on a real remote, and they refuse loudly rather than passing
      # when unconfigured - so excluding them here is the difference between a
      # green CI and a CI that cannot run at all. The exclusion is written down
      # so that "an agent ran" and "a flight landed" are never things CI appears
      # to have claimed. What they prove is recorded by hand, against the
      # criteria that name them. RealStack joined them for slice twenty-eight:
      # those tests boot the console against a LIVE control plane, which CI does
      # not run, and they seed their own tenant rather than mocking one - so
      # what they measure is the product and not a double.
      # The parentheses are load-bearing: without them the expression matches
      # NOTHING and CI passes having run zero tests, which is the worst possible
      # failure mode for a filter. Measured before it was committed.
      - run: dotnet test -c Release -- --treenode-filter '/*/*/*[(Category!=RealAgent)&(Category!=RealRemote)&(Category!=RealDocker)&(Category!=RealStack)]/*'

  aot:
    name: aot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: AOT-publish gg as a single self-contained binary
        run: dotnet publish Gg.Cli -c Release -r linux-x64 -o artifacts/aot
      - name: The published binary actually runs
        run: ./artifacts/aot/gg --version

  # THE ARTEFACT MOST PEOPLE INSTALL, and until now nothing ran it. The `aot`
  # job above proves the NATIVE binary works; the tool package is IL, packed
  # with -p:PublishAot=false, and is a different build of the same code. Once
  # provisioning installs the tool, "CI is green" stopped meaning "the thing on
  # the host runs" - so this installs the package and types the command.
  tool:
    name: tool
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      # THE SAME COMMAND publish-cli.yml PACKS WITH. If these drift, this job
      # proves a package nobody ships.
      - name: Pack the tool exactly as the release does
        run: dotnet pack Gg.Cli -c Release -p:PublishAot=false -o artifacts
      # --tool-path RATHER THAN -g, and it is the point of the step. A global
      # install lands in the runner's HOME and is invoked off PATH, so a green
      # step could mean some other gg answered. This runs the shim by the path
      # it was just written to, and nothing else can satisfy it.
      - name: Install it from the package and run the command people type
        run: |
          dotnet tool install GlyphGuild.Gg.Cli \
            --tool-path artifacts/tool \
            --add-source artifacts
          ./artifacts/tool/gg --version

  ci:
    name: CI
    needs: [dotnet, aot, tool]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
