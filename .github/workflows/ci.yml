name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  dotnet:
    name: dotnet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet build -c Release
      - run: dotnet test -c Release

  console:
    name: console
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.0
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  generated-sync:
    name: generated-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet run --project tools/Gg.ContractsGen -- console/src/generated
      - name: Fail if console/src/generated is stale
        run: |
          if ! git diff --exit-code -- console/src/generated; then
            echo "::error::console/src/generated is out of sync with Gg.Contracts. Run: dotnet run --project tools/Gg.ContractsGen"
            exit 1
          fi

  ci:
    name: CI
    needs: [dotnet, console, generated-sync]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: All required jobs succeeded
        run: |
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
