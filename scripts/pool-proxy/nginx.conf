# The scope-enforcing socket proxy - slice twelve's answer to section 12's
# hardest row. The Docker socket is host root; this proxy is the something
# that is not us which refuses an out-of-inventory reach, and the resident
# runner's GG_POOL_ENDPOINT points HERE, never at the socket.
#
# Allowed, and nothing else:
#   GET  /v*/containers/json           the pool listing (prefix re-checked client-side)
#   POST /v*/containers/create?name=gg-e2e-pool-*   creating a pool member
#   any  /v*/containers/gg-e2e-pool-*/...            acting on a pool member
#
# Everything else - exec, images, volumes, build, networks, other containers -
# answers 403 from the proxy itself. HONEST GAP, recorded where a reader
# looks: this is endpoint+name filtering, the operate-only scope; a
# production host wants this same proxy hardened (or a daemon authz plugin),
# and shipping the slice does not close that.
#
# Run it (the socket is mounted into this one container and nowhere else):
#   docker run -d --name gg-pool-proxy -p 127.0.0.1:23750:80 \
#     -v /var/run/docker.sock:/var/run/docker.sock \
#     -v "$PWD/scripts/pool-proxy/nginx.conf:/etc/nginx/nginx.conf:ro" nginx:1.27
events {}
http {
  server {
    listen 80;

    # The pool listing. The daemon's name filter is substring-matched, so the
    # adapter re-checks the prefix; the proxy's job is that nothing OUTSIDE
    # the listing and the pool's own members is reachable at all.
    location ~ ^/v[0-9.]+/containers/json$ {
      proxy_pass http://docker;
    }
    location = /containers/json {
      proxy_pass http://docker;
    }

    # Creating a pool member: only names carrying the pool prefix.
    location ~ ^(/v[0-9.]+)?/containers/create$ {
      if ($arg_name !~ ^gg-e2e-pool-) { return 403; }
      proxy_pass http://docker;
    }

    # Acting on a pool member: inspect, start, stop, wait, delete.
    location ~ ^(/v[0-9.]+)?/containers/gg-e2e-pool- {
      proxy_pass http://docker;
    }

    # The refusal the scope probe expects, and the whole point.
    location / {
      return 403;
    }
  }

  upstream docker {
    server unix:/var/run/docker.sock;
  }
}
