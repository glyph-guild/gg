name: Publish Gg.Contracts

on:
  push:
    branches: [main]

jobs:
  pack:
    name: pack and publish 0.1.0-alpha.N
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Compute prerelease suffix from commit count
        run: echo "VERSION_SUFFIX=alpha.$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
      - run: dotnet pack Gg.Contracts/Gg.Contracts.csproj -c Release --version-suffix "$VERSION_SUFFIX" -o artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: nuget
          path: artifacts/*.nupkg
      # Published to GitHub Packages using the built-in token, so the control
      # plane consumes a real published package rather than a project
      # reference across the repo boundary - which is the alignment the split
      # was meant to buy.
      - name: Push to GitHub Packages
        run: |
          dotnet nuget push artifacts/*.nupkg \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source https://nuget.pkg.github.com/glyph-guild/index.json \
            --skip-duplicate
